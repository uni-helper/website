<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - uni-helper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #18181b; background: #fff;
    }
    .wrap { width: min(720px, calc(100% - 48px)); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; color: inherit; text-decoration: none; margin-bottom: 64px; }
    .brand img { width: 28px; height: 28px; }
    h1 { font-size: 96px; line-height: 1; letter-spacing: -0.04em; font-weight: 800; }
    p { margin-top: 16px; font-size: 18px; color: #71717a; }
    .button { display: inline-flex; margin-top: 32px; padding: 10px 20px; border-radius: 8px; background: #18181b; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/"><img src="/logo.svg" alt=""> uni-helper</a>
    <h1>404</h1>
    <p>页面不存在，可能已经被移动或删除。</p>
    <a class="button" href="/">回到首页</a>
  </main>
</body>
</html>
